name: Release

# Automatic releases follow successful same-SHA Pages deployment, which itself requires
# successful full main-push CI. Manual retries must prove both success gates.
on:
  workflow_run:
    workflows: [Deploy Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version already set in package.json
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Verify full main CI, Pages deployment and exact current SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SOURCE_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Manual releases are allowed only from main."
            exit 1
          fi
          LOCAL_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "${MAIN_SHA}" ] || [ "${LOCAL_SHA}" != "${MAIN_SHA}" ]; then
            echo "::error::Release source is not the current main commit."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            if [ "${DEPLOY_SOURCE_SHA}" != "${LOCAL_SHA}" ] || [ "${DEPLOY_SOURCE_REPO}" != "${GITHUB_REPOSITORY}" ]; then
              echo "::error::Successful Pages run does not describe the current repository/main SHA."
              exit 1
            fi
          fi
          # This also protects manual dispatch: both full CI and Pages must
          # have succeeded on the exact current main commit.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${LOCAL_SHA}&event=push&status=success&per_page=100" |
            jq -e --arg sha "${LOCAL_SHA}" \
              'any(.workflow_runs[]; .name == "CI" and .head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")' > /dev/null || {
                echo "::error::No successful full push-triggered CI for the current main SHA."
                exit 1
              }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${LOCAL_SHA}&event=workflow_run&status=success&per_page=100" |
            jq -e --arg sha "${LOCAL_SHA}" \
              'any(.workflow_runs[]; .name == "Deploy Pages" and .head_sha == $sha and .head_branch == "main" and .event == "workflow_run" and .conclusion == "success")' > /dev/null || {
                echo "::error::No successful CI-gated Pages deployment for the current main SHA."
                exit 1
              }
          echo "Verified full CI and same-SHA Pages deployment at ${LOCAL_SHA}."

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Resolve release version (never rewrite published assets)
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          VERSION="${PACKAGE_VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Manual release version must equal package.json version."
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Only stable X.Y.Z versions are allowed."
            exit 1
          fi
          TAG="v${VERSION}"
          SHOULD_RELEASE=true
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            LOCAL_SHA="$(git rev-parse HEAD)"
            if [ "${TAG_SHA}" != "${LOCAL_SHA}" ]; then
              # Normal main pushes after a release keep the old package version.
              # Do not re-tag or mutate the historical assets, even manually.
              echo "Existing ${TAG} belongs to ${TAG_SHA}; leaving published release unchanged."
              SHOULD_RELEASE=false
            elif gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; never overwrite its assets."
              SHOULD_RELEASE=false
            else
              echo "Existing tag ${TAG} points to the same SHA but Release is absent; resume initial publication."
            fi
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${SHOULD_RELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Enforce stable dependency policy
        if: steps.version.outputs.should_release == 'true'
        run: node scripts/check-stable-dependencies.mjs

      - name: Setup pnpm
        if: steps.version.outputs.should_release == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - name: Install dependencies
        if: steps.version.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck / Lint
        if: steps.version.outputs.should_release == 'true'
        run: |
          pnpm run typecheck
          pnpm run typecheck:critical
          pnpm run i18n:audit
          pnpm run lint

      - name: Run tests
        if: steps.version.outputs.should_release == 'true'
        run: pnpm run test

      - name: Build production assets
        if: steps.version.outputs.should_release == 'true'
        run: pnpm run build

      - name: Verify production PWA app-shell precache
        if: steps.version.outputs.should_release == 'true'
        run: node scripts/check-pwa-precache.mjs

      - name: Enforce performance budget
        if: steps.version.outputs.should_release == 'true'
        run: pnpm run perf:budget

      - name: Package release assets
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          (
            cd dist
            zip -r "../pagevela-${VERSION}.zip" .
            tar -czf "../pagevela-${VERSION}.tar.gz" .
          )
          sha256sum "pagevela-${VERSION}.zip" "pagevela-${VERSION}.tar.gz" > SHA256SUMS.txt

      - name: Refuse a superseded main commit before tagging
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "${MAIN_SHA}" ] || [ "${LOCAL_SHA}" != "${MAIN_SHA}" ]; then
            echo "::error::main advanced during release build; refusing to tag stale artifacts."
            exit 1
          fi

      - name: Create release tag
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [ "${TAG_SHA}" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag ${TAG} already points to a different commit."
              exit 1
            fi
            echo "Reusing same-commit tag ${TAG} for an unpublished Release."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Pagevela ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Publish GitHub Release without replacing assets
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          LOCAL_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "${MAIN_SHA}" ] || [ "${LOCAL_SHA}" != "${MAIN_SHA}" ]; then
            echo "::error::main changed before release publication; refusing stale assets."
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "${TAG}" \
            "pagevela-${VERSION}.zip" \
            "pagevela-${VERSION}.tar.gz" \
            "SHA256SUMS.txt" \
            --verify-tag \
            --title "Pagevela ${TAG}" \
            --generate-notes \
            --latest
