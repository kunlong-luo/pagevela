name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled checks must not cancel validation for a production main push.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Enforce stable dependency policy
        run: node scripts/check-stable-dependencies.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit bilingual UI labels
        run: pnpm run i18n:audit

      - name: Typecheck
        run: pnpm run typecheck

      - name: Strict critical boundaries
        run: pnpm run typecheck:critical

      - name: ESLint
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test

      - name: Build project
        run: pnpm run build

      - name: Verify production PWA app-shell precache
        run: node scripts/check-pwa-precache.mjs

      - name: Enforce performance budget
        run: pnpm run perf:budget

  e2e-chromium:
    name: e2e-chromium
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full Chromium E2E suite
        run: pnpm exec playwright test --project=chromium

      # Playwright's normal webServer uses Vite dev mode, where PWA is disabled.
      # Also exercise the real production SW and an offline editor navigation.
      - name: Verify production PWA offline navigation (Chromium)
        run: |
          pnpm run build
          node scripts/check-pwa-offline.mjs

      - name: Upload fictional A4 print proof for visual review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chinese-a4-print-proof
          path: |
            test-results/**/chinese-a4-print-proof.pdf
            test-results/**/chinese-a4-multipage-print-proof.pdf
          if-no-files-found: warn
          retention-days: 7

  # Run full main/nightly Firefox and WebKit coverage in four parallel shards.
  # Keeping the required e2e-cross-browser job below preserves branch
  # protection while avoiding a 30-minute sequential 438-test timeout.
  e2e-browser-shard:
    name: e2e-browser-shard (${{ matrix.browser }} ${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            shard: '1/2'
          - browser: firefox
            shard: '2/2'
          - browser: webkit
            shard: '1/2'
          - browser: webkit
            shard: '2/2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install selected browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run full browser test shard
        run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}

      # The headed Firefox proof shares the fully installed Firefox shard.
      # Do not duplicate this browser installation on a serial aggregate job.
      - name: Verify actual Firefox thin scrollbar in a headed browser
        if: matrix.browser == 'firefox' && matrix.shard == '1/2'
        run: >-
          xvfb-run -a env FIREFOX_HEADED_SCROLLBAR_CHECK=1
          pnpm exec playwright test e2e/help-privacy.e2e.ts
          --project=firefox --headed
          --grep "help and privacy use the branded capsule scrollbar"

  e2e-cross-browser:
    name: e2e-cross-browser
    needs:
      - quality
      - e2e-browser-shard
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      (github.event_name == 'pull_request' || needs.e2e-browser-shard.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile

      - name: Install Firefox and WebKit
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps firefox webkit

      - name: Run critical Firefox/WebKit E2E on pull requests
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec playwright test
          e2e/critical-flows.e2e.ts
          e2e/accessibility.e2e.ts
          e2e/simplified-layout.e2e.ts
          e2e/mobile-preview-footer-clearance.e2e.ts
          e2e/mobile-keyboard-focus.e2e.ts
          e2e/mobile-viewport.e2e.ts
          e2e/help-privacy.e2e.ts
          e2e/onboarding.e2e.ts
          --project=firefox
          --project=webkit

      - name: Verify actual Firefox thin scrollbar in a headed browser
        if: github.event_name == 'pull_request'
        run: >-
          xvfb-run -a env FIREFOX_HEADED_SCROLLBAR_CHECK=1
          pnpm exec playwright test e2e/help-privacy.e2e.ts
          --project=firefox --headed
          --grep "help and privacy use the branded capsule scrollbar"

      - name: Confirm full Firefox/WebKit shards and headed Firefox proof
        if: github.event_name != 'pull_request'
        run: echo "All full browser shards and the headed Firefox scrollbar proof succeeded"


  build-and-test:
    name: build-and-test
    needs:
      - quality
      - e2e-chromium
      - e2e-cross-browser
    # The branch ruleset requires build-and-test. GitHub accepts a skipped
    # required check as satisfied, so NEVER skip this aggregator when a
    # dependency fails. Always run it and explicitly fail non-success results.
    # PRs intentionally skip e2e-browser-shard; e2e-cross-browser runs the
    # Firefox/WebKit critical suite and is the required dependency here.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce every required CI result
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CHROMIUM_RESULT: ${{ needs.e2e-chromium.result }}
          CROSS_BROWSER_RESULT: ${{ needs.e2e-cross-browser.result }}
        run: |
          echo "quality=$QUALITY_RESULT chromium=$CHROMIUM_RESULT cross-browser=$CROSS_BROWSER_RESULT"
          if [ "$QUALITY_RESULT" != "success" ] || \
             [ "$CHROMIUM_RESULT" != "success" ] || \
             [ "$CROSS_BROWSER_RESULT" != "success" ]; then
            echo "::error::Required CI failed or was skipped; blocking the protected build-and-test gate."
            exit 1
          fi
          echo "All required CI jobs succeeded."
