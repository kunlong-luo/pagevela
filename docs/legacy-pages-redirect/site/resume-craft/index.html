<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta name="referrer" content="no-referrer">
  <title>Pagevela — 网站地址已更新</title>
  <script id="legacy-pagevela-redirect">
(function () {
  'use strict';
  var location = window.location;
  var prefix = '/resume-craft';
  var current = location.pathname;

  // Never intercept unrelated user-site paths.
  if (current !== prefix && current.indexOf(prefix + '/') !== 0) return;

  var suffix = current.slice(prefix.length).replace(/^\/+/, '');
  var destination = new URL('/pagevela/', location.origin);

  // GitHub Pages does not rewrite /pagevela/editor to the single-page app.
  if (suffix === 'editor' || suffix === 'editor/') {
    var params = new URLSearchParams(location.search);
    if (!params.has('page') && !params.has('view') && !params.has('route')) {
      params.set('page', 'editor');
    }
    destination.search = params.toString();
  } else {
    // Preserve exact old asset links where the new Pages site has equivalents.
    if (/^(?:assets\/.+|[^/]+\.(?:png|svg|ico|webmanifest|json|xml|txt|js|css|woff2?))$/i.test(suffix)) {
      destination.pathname = '/pagevela/' + suffix;
    }
    destination.search = location.search;
  }

  // IMPORTANT: encrypted and legacy resume shares may live in the fragment.
  destination.hash = location.hash;
  location.replace(destination.href);
})();
  </script>
  <style>

  </style>
