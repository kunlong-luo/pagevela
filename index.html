    <script>
      (() => {
        try {
          const saved = localStorage.getItem('resume_theme_mode') || 'system';
          const isDark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.startupTheme = isDark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.startupTheme = 'light';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'%3E%3Cpath d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z'/%3E%3C/svg%3E" />

    <meta name="apple-mobile-web-app-title" content="Pagevela" />
    <script>
      // Match the public router before React hydrates: the root always opens
      // the welcome page, while explicit editor deep links keep their own preview.
      (() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const page = params.get('page') || params.get('view') || params.get('route');
          const hash = window.location.hash.toLowerCase();
          const path = window.location.pathname.replace(/\/$/, '');
          const isEditor = page === 'editor' ||
            (page !== 'landing' && page !== 'home' &&
              (hash.includes('#/editor') || hash === '#editor' || path.endsWith('/editor')));
          document.documentElement.dataset.startupRoute = isEditor ? 'editor' : 'landing';
        } catch {
          document.documentElement.dataset.startupRoute = 'landing';
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'%3E%3Cpath d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z'/%3E%3C/svg%3E" />
  </head>
  <body class="bg-[#070a13] text-slate-100">
    <div id="root">
      <div class="startup-shell" aria-hidden="true">
        <div class="startup-topbar">
          <div class="startup-brand">
            <div class="startup-logo">P</div>
            <div class="startup-brand-name">Pagevela</div>
            <div class="startup-chip startup-shimmer"></div>
          </div>
          <div class="startup-actions">
            <div class="startup-icon startup-shimmer"></div>
            <div class="startup-button startup-shimmer"></div>
          </div>
        </div>
        <div class="startup-welcome">
          <div class="startup-welcome-hero">
            <div class="startup-welcome-tag startup-shimmer"></div>
            <div class="startup-welcome-heading">Pagevela</div>
            <div class="startup-welcome-description startup-shimmer"></div>
            <div class="startup-welcome-description short startup-shimmer"></div>
            <div class="startup-welcome-cta startup-shimmer"></div>
          </div>
          <div class="startup-welcome-showcase">
            <div class="startup-welcome-showcase-header startup-shimmer"></div>
            <div class="startup-welcome-showcase-grid">
              <div class="startup-welcome-showcase-panel">
                <div class="startup-welcome-previewline startup-shimmer"></div>
                <div class="startup-welcome-previewline startup-shimmer"></div>
                <div class="startup-welcome-previewline short startup-shimmer"></div>
              </div>
              <div class="startup-welcome-showcase-panel">
                <div class="startup-welcome-previewline startup-shimmer"></div>
                <div class="startup-welcome-previewline startup-shimmer"></div>
                <div class="startup-welcome-previewline short startup-shimmer"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="startup-toolbar">
          <div class="startup-toolbar-pill startup-shimmer"></div>
          <div class="startup-toolbar-pill startup-shimmer"></div>
          <div class="startup-toolbar-pill startup-shimmer"></div>
          <div class="startup-toolbar-pill startup-shimmer"></div>
        </div>
        <div class="startup-workspace">
          <div class="startup-editor">
            <div class="startup-section-title startup-shimmer"></div>
            <div class="startup-field startup-shimmer"></div>
            <div class="startup-field startup-shimmer"></div>
            <div class="startup-field startup-shimmer"></div>
            <div class="startup-field startup-shimmer"></div>
          </div>
          <div class="startup-preview">
            <div class="startup-paper">
              <div class="startup-paper-line w60 startup-shimmer"></div>
              <div class="startup-paper-line w86 startup-shimmer"></div>
              <div class="startup-paper-line w74 startup-shimmer"></div>
              <div class="startup-paper-block startup-shimmer"></div>
              <div class="startup-paper-line w82 startup-shimmer"></div>
              <div class="startup-paper-line w68 startup-shimmer"></div>
            </div>
          </div>
        </div>
      </div>
      <style>
        html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; }
        .startup-shell {
          --startup-bg: #f8fafc;
          --startup-panel: #ffffff;
          --startup-soft: #f1f5f9;
          --startup-border: rgba(148,163,184,.24);
          --startup-skeleton: rgba(148,163,184,.18);
          --startup-skeleton-hi: rgba(148,163,184,.34);
          min-height: 100dvh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          background: var(--startup-bg);
          color: #0f172a;
          font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        }
        html[data-startup-theme="dark"] .startup-shell {
          --startup-bg: #070a13;
          --startup-panel: #0f172a;
          --startup-soft: #0b1220;
          --startup-border: rgba(71,85,105,.38);
          --startup-skeleton: rgba(100,116,139,.18);
          --startup-skeleton-hi: rgba(148,163,184,.28);
          color: #e2e8f0;
        }
        .startup-topbar {
          height: 48px;
          flex: 0 0 48px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 16px;
          background: color-mix(in srgb, var(--startup-panel) 94%, transparent);
          border-bottom: 1px solid var(--startup-border);
        }
        .startup-brand,.startup-actions { display:flex; align-items:center; gap:10px; }
        .startup-logo {
          width: 30px; height: 30px; border-radius: 10px;
          display:flex; align-items:center; justify-content:center;
          background: linear-gradient(135deg,#4f46e5,#7c3aed);
          color:white; font-size:11px; font-weight:900;
          box-shadow: 0 6px 16px rgba(79,70,229,.18);
        }
        .startup-brand-name { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
        .startup-chip { width: 68px; height: 24px; border-radius: 8px; }
        .startup-icon { width: 30px; height: 30px; border-radius: 9px; }
        .startup-button { width: 92px; height: 30px; border-radius: 10px; }
        .startup-toolbar {
          height: 42px;
          flex: 0 0 42px;
          display:flex; align-items:center; gap:8px; padding:0 16px;
          background: var(--startup-panel);
          border-bottom:1px solid var(--startup-border);
        }
        .startup-toolbar-pill { width:72px; height:24px; border-radius:8px; }
        .startup-workspace { flex:1; min-height:0; display:flex; overflow:hidden; }
        .startup-editor {
          width:50%; min-width:0; box-sizing:border-box; padding:22px;
          background:var(--startup-panel); border-right:1px solid var(--startup-border);
        }
        .startup-section-title { width:34%; height:14px; border-radius:6px; margin-bottom:22px; }
        .startup-field { width:100%; height:38px; border-radius:10px; margin-bottom:12px; }
        .startup-preview {
          width:50%; min-width:0; overflow:hidden; padding:24px;
          display:flex; align-items:flex-start; justify-content:center;
          background:var(--startup-soft);
        }
        .startup-paper {
          width:min(76%, 430px); aspect-ratio:210/297; box-sizing:border-box;
          padding:9% 8%; border-radius:3px; background:white;
          box-shadow:0 18px 50px rgba(15,23,42,.10),0 0 0 1px rgba(15,23,42,.05);
        }
        html[data-startup-theme="dark"] .startup-paper { box-shadow:0 18px 60px rgba(0,0,0,.35); }
        .startup-paper-line { height:8px; border-radius:4px; margin-bottom:10px; }
        .startup-paper-block { height:24%; border-radius:6px; margin:20px 0; }
        .w60 { width:60%; }.w68 { width:68%; }.w74 { width:74%; }.w82 { width:82%; }.w86 { width:86%; }
        .startup-shimmer {
          background:linear-gradient(90deg,var(--startup-skeleton) 25%,var(--startup-skeleton-hi) 50%,var(--startup-skeleton) 75%);
          background-size:200% 100%; animation:startup-shimmer 1.35s ease-in-out infinite;
        }
        @keyframes startup-shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }
        /* A cold visit should look like the welcome page, not the editor. */
        .startup-welcome {
          flex: 1; min-height: 0; overflow: hidden;
          display: flex; flex-direction: column; align-items: center;
          padding: clamp(24px, 5vh, 60px) 20px 0; box-sizing: border-box; gap: 30px;
        }
        .startup-welcome-hero { width: min(100%, 680px); display:flex; align-items:center; flex-direction:column; gap:15px; }
        .startup-welcome-tag { width: 155px; height: 22px; border-radius: 11px; }
        .startup-welcome-heading { font-size: clamp(28px, 5vw, 44px); font-weight: 900; letter-spacing: -.04em; }
        .startup-welcome-description { height: 15px; width: min(100%, 510px); border-radius: 8px; }
        .startup-welcome-description.short { width: min(75%, 380px); }
        .startup-welcome-cta { margin-top: 8px; width: 192px; height: 46px; border-radius: 14px; }
        .startup-welcome-showcase {
          width: min(100%, 880px); min-height: 180px; flex: 1;
          border: 1px solid var(--startup-border); border-radius: 20px 20px 0 0;
          background: var(--startup-panel); box-shadow: 0 20px 50px rgba(15,23,42,.09);
          padding: 24px; box-sizing: border-box;
        }
        .startup-welcome-showcase-header { width: 165px; height: 16px; border-radius: 8px; margin-bottom: 24px; }
        .startup-welcome-showcase-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 100%; }
        .startup-welcome-showcase-panel { min-height: 150px; border-radius: 12px; background: var(--startup-soft); padding: 20px; }
        .startup-welcome-previewline { height: 13px; margin-bottom: 19px; border-radius: 8px; }
        .startup-welcome-previewline.short { width: 68%; }
        html:not([data-startup-route="editor"]) .startup-toolbar,
        html:not([data-startup-route="editor"]) .startup-workspace { display: none; }
        html[data-startup-route="editor"] .startup-welcome { display: none; }
        @media (max-width: 767px) {
          .startup-welcome { padding: 36px 14px 0; gap: 26px; }
          .startup-welcome-showcase { padding: 18px; }
          .startup-welcome-showcase-grid { grid-template-columns: 1fr; }
          .startup-welcome-showcase-panel + .startup-welcome-showcase-panel { display: none; }
          .startup-topbar { height:48px; flex-basis:48px; padding:0 12px; }
          .startup-toolbar { padding:0 12px; overflow:hidden; }
          .startup-brand-line { width:72px; }
          .startup-chip { display:none; }
          .startup-editor { width:100%; padding:18px 14px 72px; border-right:0; }
          .startup-preview { display:none; }
        }
        @media (prefers-reduced-motion: reduce) { .startup-shimmer { animation:none; } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
